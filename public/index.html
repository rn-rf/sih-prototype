<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Classroom</title>
<style>
body { font-family:sans-serif; margin:50px; }
.container { max-width:500px; margin:auto; text-align:center; }
button, input { padding:10px 20px; margin:10px; font-size:16px; }
input { width:200px; }
</style>
</head>
<body>
<div class="container">
  <h1>Virtual Classroom</h1>
  
  <div>
    <h2>Create Room</h2>
    <a href="/create">
      <button>Create Room</button>
    </a>
  </div>
  
  <hr>
  
  <div>
    <h2>Join Room</h2>
    <form action="/join" method="get">
      <input type="text" name="code" placeholder="Enter room code" required>
      <input type="text" name="nickname" placeholder="Your nickname" required>
      <button type="submit">Join Room</button>
    </form>
  </div>
</div>
</body>
</html>
