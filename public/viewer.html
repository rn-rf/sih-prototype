<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewer Classroom</title>
<style>
body { font-family:sans-serif; margin:0; padding:0; }
.player { position:relative; width:100%; max-width:900px; margin:auto; }
.slide { width:100%; border:1px solid #ccc; min-height:500px; position:relative; }
canvas { position:absolute; top:0; left:0; pointer-events:none; }
.viewer-control-bar { display:flex; justify-content:center; gap:10px; margin-top:10px; flex-wrap:wrap; }
.viewer-control-bar button { padding:10px 20px; }
</style>
</head>
<body>

<h1>Viewer Classroom</h1>
<p>Room Code: <span id="roomCode">Loading...</span></p>

<div class="player">
  <div class="slide" id="slideContainer">
    <canvas id="doodleCanvas"></canvas>
    <img id="currentSlide" src="" alt="Slide" style="width:100%; display:block;">
  </div>

  <div class="viewer-control-bar">
    <button class="responseBtn" data-response="Yes">Yes</button>
    <button class="responseBtn" data-response="No">No</button>
    <button class="responseBtn" data-response="Maybe">Maybe</button>
    <button id="micToggle">Mic</button>
    <button id="leaveRoom">Leave</button>
  </div>
</div>

<audio id="remoteAudio" autoplay playsinline></audio>

<script src="/socket.io/socket.io.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const roomCode = urlParams.get('code');
const nickname = urlParams.get('nickname') || 'Anonymous';
document.getElementById('roomCode').innerText = roomCode;

const socket = io();
socket.emit('join-room',{ code: roomCode, role:'viewer', nickname: nickname });

socket.on('error', ({ message }) => {
  alert(message);
  window.location.href = '/';
});

// Store slides locally for instant navigation
let allSlides = [];
let currentSlideIndex = 0;

socket.on('all-slides', ({ slides, currentIndex }) => {
  allSlides = slides;
  currentSlideIndex = currentIndex;
  // Preload all images
  slides.forEach(src => {
    const img = new Image();
    img.src = src;
  });
  console.log('Preloaded', slides.length, 'slides');
});

// ---------------- Slides & Doodle -----------------
const slideImg = document.getElementById('currentSlide');
const canvas = document.getElementById('doodleCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas(){ canvas.width=slideImg.clientWidth; canvas.height=slideImg.clientHeight; }
window.addEventListener('resize',resizeCanvas);
slideImg.addEventListener('load',resizeCanvas);
resizeCanvas();

socket.on('slide-update',({ src, index })=>{
  currentSlideIndex = index;
  slideImg.src = src;
  ctx.clearRect(0,0,canvas.width,canvas.height);
});

socket.on('clear-doodles',()=>{
  ctx.clearRect(0,0,canvas.width,canvas.height);
});

socket.on('doodle',({ x,y })=>{
  ctx.lineWidth=2; ctx.strokeStyle='red'; ctx.lineCap='round';
  ctx.lineTo(x,y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x,y);
});

// ---------------- Responses -----------------
const responseButtons = document.querySelectorAll('.responseBtn');
responseButtons.forEach(btn=>{
  btn.addEventListener('click',()=>{
    const resp = btn.dataset.response;
    socket.emit('response',{ code:roomCode, response:resp });
    responseButtons.forEach(b=>b.disabled=true);
    setTimeout(()=>responseButtons.forEach(b=>b.disabled=false),5000);
  });
});

socket.on('room-closed',()=>{ alert('Room closed'); window.location.href='/'; });

// ---------------- WebRTC Audio -----------------
let pc, localStream, micEnabled=false;
let silentStream = null;

async function initWebRTC(){
  try {
    pc = new RTCPeerConnection({
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    });
    
    pc.onconnectionstatechange = ()=>console.log("Viewer connection state: "+pc.connectionState);
    pc.ontrack = e=>{
      console.log('Received master audio track');
      document.getElementById('remoteAudio').srcObject=e.streams[0];
    };
    pc.onicecandidate = e=>{ 
      if(e.candidate) socket.emit('webrtc-candidate',{ code:roomCode, candidate:e.candidate, to:null }); 
    };

    // Always add a silent track initially
    const audioContext = new AudioContext();
    const destination = audioContext.createMediaStreamDestination();
    silentStream = destination.stream;
    silentStream.getTracks().forEach(track=>pc.addTrack(track,silentStream));
    console.log('Added silent track to connection');

    // Create offer
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    socket.emit('webrtc-offer',{ code:roomCode, offer });
    console.log("Viewer sent offer");
  } catch(error) {
    console.error('WebRTC init error:', error);
  }
}

socket.on('webrtc-answer', async ({ answer, from })=>{
  console.log("Viewer got answer");
  await pc.setRemoteDescription(answer);
});

socket.on('webrtc-candidate', ({ candidate, from })=>{
  pc.addIceCandidate(candidate).catch(console.error);
});

initWebRTC();

// Viewer mic toggle
document.getElementById('micToggle').addEventListener('click', async ()=>{
  if(!pc) return;
  
  if(!micEnabled){
    try {
      // Get real microphone
      localStream = await navigator.mediaDevices.getUserMedia({ audio:true });
      localStream.getAudioTracks()[0].enabled = true;
      
      // Replace silent track with real mic
      const senders = pc.getSenders();
      const audioSender = senders.find(s => s.track && s.track.kind === 'audio');
      if(audioSender && localStream.getAudioTracks()[0]) {
        await audioSender.replaceTrack(localStream.getAudioTracks()[0]);
        console.log('Replaced silent track with real mic');
      } else {
        localStream.getTracks().forEach(track=>pc.addTrack(track,localStream));
      }
      
      micEnabled = true;
      document.getElementById('micToggle').innerText='Mic On';
      console.log("Viewer mic enabled");
    } catch(err) {
      alert('Could not access microphone');
      console.error(err);
    }
  } else {
    // Stop real mic and replace with silent
    if(localStream) {
      localStream.getTracks().forEach(t=>t.stop());
    }
    
    const senders = pc.getSenders();
    const audioSender = senders.find(s => s.track && s.track.kind === 'audio');
    if(audioSender && silentStream.getAudioTracks()[0]) {
      await audioSender.replaceTrack(silentStream.getAudioTracks()[0]);
      console.log('Replaced mic with silent track');
    }
    
    localStream = null;
    micEnabled = false;
    document.getElementById('micToggle').innerText='Mic';
    console.log("Viewer mic disabled");
  }
});

// Leave button
document.getElementById('leaveRoom').addEventListener('click',()=>{
  if(localStream) localStream.getTracks().forEach(t=>t.stop());
  if(pc) pc.close();
  window.location.href='/';
});
</script>
</body>
</html>
